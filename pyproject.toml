[project]
name = "reforged-inbox"
version = "0.1.0"
description = "A bridge between public-inbox and GitHub/GitLab"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dramatiq[redis,watch]>=1.17.1",
    "ruff>=0.11.0",
    "sentry-sdk>=2.23.1",
    "sqlmodel>=0.0.24",
    "pygithub>=2.6.1",
    "fastapi[standard]>=0.115.12",
    "redis>=5.2.1",
    "redmail>=0.6.0",
    "apscheduler>=3.11.0",
]
